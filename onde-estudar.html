<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onde estudar</title>
<style>
  :root{
    --fundo:#151A21; --sup:#1D242D; --sup2:#232C37; --linha:#2E3944;
    --texto:#E4E9EE; --fraco:#8697A6; --apagado:#5C6C7A;
    --ok:#3FA57A; --azul:#4C8FD1; --alerta:#D2544A; --amarela:#E3B341;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .env{max-width:960px;margin:0 auto;padding:24px 18px 80px}
  h1{font:400 27px/1.15 Georgia,serif;margin:0 0 4px}
  h2{font:400 20px/1.2 Georgia,serif;margin:0 0 10px}
  .sub{color:var(--fraco);font-size:13px;margin:0}
  .topo{border-bottom:2px solid var(--linha);padding-bottom:14px;margin-bottom:24px;
        display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .tot{text-align:right;font-size:12px;color:var(--fraco)}
  .tot b{display:block;font:400 24px/1 Georgia,serif;color:var(--texto)}

  /* CARDS DE MATÉRIA */
  .mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
  .mat{background:var(--sup);border:1px solid var(--linha);border-left:5px solid var(--c);
       padding:16px 18px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:block;width:100%}
  .mat:hover{background:var(--sup2)}
  .mat .n{font:400 19px/1.2 Georgia,serif;margin-bottom:3px}
  .mat .d{font-size:12.5px;color:var(--fraco);margin-bottom:11px;min-height:34px}
  .mat .b{height:6px;background:var(--sup2);margin-bottom:7px}
  .mat .b i{display:block;height:100%;background:var(--c)}
  .mat .f{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fraco)}
  .mat .f b{color:var(--c);font-weight:600}
  .bloqtag{font-size:10px;font-weight:700;padding:2px 6px;background:var(--amarela);color:#10151B}

  /* DETALHE */
  .voltar{font:inherit;font-size:13px;background:none;border:0;color:var(--azul);
          cursor:pointer;padding:0;margin-bottom:16px}
  .voltar:hover{text-decoration:underline}
  .como{background:var(--sup);border:1px solid var(--linha);border-left:5px solid var(--c);
        padding:15px 18px;margin-bottom:20px}
  .como h3{font:600 12px/1 inherit;letter-spacing:.05em;color:var(--c);margin:0 0 9px}
  .como p{margin:0 0 9px;font-size:13.5px}
  .como p:last-child{margin-bottom:0}
  .fontes{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .fonte{font-size:12px;padding:5px 10px;background:var(--sup2);border:1px solid var(--linha);
         color:var(--azul);text-decoration:none}
  .fonte:hover{border-color:var(--azul)}
  .fonte.sem{color:var(--fraco);cursor:default}

  ol.lista{list-style:none;margin:0;padding:0;counter-reset:t}
  ol.lista li{counter-increment:t;display:grid;grid-template-columns:30px 1fr 128px;gap:12px;
     background:var(--sup);border:1px solid var(--linha);border-top:0;padding:12px 14px;align-items:start}
  ol.lista li:first-child{border-top:1px solid var(--linha)}
  ol.lista li.feito{background:#1A2320}
  ol.lista li.feito .tt{color:var(--apagado);text-decoration:line-through}
  ol.lista li.trava{background:#2A1E1E}
  ol.lista li.bloq{opacity:.5}
  .num{font:400 15px/1.5 Georgia,serif;color:var(--apagado)}
  .num::before{content:counter(t)}
  .tt{font-weight:600;font-size:14px;line-height:1.35}
  .cc{font-size:12px;color:var(--fraco);margin-top:3px}
  .gg{font-size:12px;color:var(--amarela);margin-top:3px}
  .onde{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .src{font-size:11.5px;color:var(--fraco);background:var(--sup2);padding:2px 7px;border:1px solid var(--linha)}
  .src.a{color:var(--azul);text-decoration:none} .src.a:hover{border-color:var(--azul)}
  select{font:inherit;font-size:12.5px;padding:5px 6px;border:1px solid var(--linha);
         background:var(--sup2);color:var(--texto);width:100%}
  .rodape{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px;
          padding-top:15px;border-top:1px solid var(--linha)}
  .rodape button{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--linha);
          background:var(--sup);cursor:pointer;color:var(--texto)}
  .rodape button:hover{border-color:var(--texto)}
  .aviso{font-size:12px;color:var(--fraco);margin-left:auto}
  :focus-visible{outline:2px solid var(--azul);outline-offset:1px}
  @media (max-width:640px){
    ol.lista li{grid-template-columns:24px 1fr;gap:9px}
    ol.lista li select{grid-column:2}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="env">
  <div class="topo">
    <div>
      <h1>Onde estudar</h1>
      <p class="sub">Mesma base do dojo. O que você marcar aqui aparece lá.</p>
    </div>
    <div class="tot" id="tot"></div>
  </div>
  <div id="tela"></div>
  <div class="rodape">

    <input type="file" id="arq" accept=".json" hidden>

  </div>
</div>

const STATUS = ["Não iniciado","Treinando","Travei","Concluído"];
const CHAVE = "dojo:estado";           // MESMA chave do dojo — é isso que sincroniza

let estado = {_dias:[]};
let aberta = null;

const hoje = () => new Date().toISOString().slice(0,10);
const est = id => estado[id] || (estado[id] = {s:"Não iniciado",p:"",c:"",a:"",n:"",rev:"",rn:0,ok:false});
const liberado = d => !d.bloq || est(d.id).ok;

const TEM_STORAGE = typeof window.storage !== "undefined" && window.storage !== null;
async function lerStore(){
  if(TEM_STORAGE){ const r = await window.storage.get(CHAVE); return r && r.value; }
  return localStorage.getItem(CHAVE);
}
async function gravarStore(t){
  if(TEM_STORAGE) return window.storage.set(CHAVE, t);
  return localStorage.setItem(CHAVE, t);
}
async function carregar(){
  try{ const v = await lerStore(); if(v) estado = JSON.parse(v); }catch(e){}
  if(!estado._dias) estado._dias = [];
  desenhar();
}
let pend=null;
function salvar(){
  if(!estado._dias.includes(hoje())) estado._dias.push(hoje());
  clearTimeout(pend);
  pend=setTimeout(async()=>{
    try{ await gravarStore(JSON.stringify(estado)); aviso("Salvo."); }
    catch(e){ aviso("Não consegui salvar. Baixe um backup."); }
  },350);
}
function aviso(t){
  const el=document.getElementById("aviso"); el.textContent=t;
  clearTimeout(el._t); el._t=setTimeout(()=>el.textContent="Tudo é salvo sozinho.",2200);
}

function chipFonte(f){
  return f.link
    ? `<a class="src a" href="${f.link}" target="_blank" rel="noopener">${f.nome} ↗</a>`
    : `<span class="src">${f.nome}</span>`;
}

function telaMaterias(){
  const feitos = DADOS.filter(d=>est(d.id).s==="Concluído").length;
  document.getElementById("tot").innerHTML = `<b>${feitos}</b>de ${DADOS.length} tópicos`;
  document.getElementById("tela").innerHTML = `<div class="mats">` + MATERIAS.map(m=>{
    const l = DADOS.filter(d=>d.f===m.id);
    const ok = l.filter(d=>est(d.id).s==="Concluído").length;
    const bloq = l.filter(d=>!liberado(d)).length;
    return `<button class="mat" style="--c:${m.cor}" data-m="${m.id}">
      <div class="n">${m.nome}</div>
      <div class="d">${m.desc}</div>
      <div class="b"><i style="width:${(ok/l.length*100).toFixed(1)}%"></i></div>
      <div class="f"><span><b>${ok}</b> de ${l.length} tópicos</span>
        ${bloq?`<span class="bloqtag">${bloq} bloqueados</span>`:`<span>abrir →</span>`}</div>
    </button>`;
  }).join("") + `</div>`;
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ aberta=b.dataset.m; desenhar(); });
}

function telaDetalhe(){
  const m = MATERIAS.find(x=>x.id===aberta);
  const l = DADOS.filter(d=>d.f===m.id);
  const ok = l.filter(d=>est(d.id).s==="Concluído").length;
  document.getElementById("tot").innerHTML = `<b>${ok}</b>de ${l.length} em ${m.nome}`;
  document.getElementById("tela").innerHTML = `
    <button class="voltar" id="volta">← todas as matérias</button>
    <h2>${m.nome}</h2>
    <div class="como" style="--c:${m.cor}">
      <h3>COMO ESTUDAR</h3>
      ${m.como.map(p=>`<p>${p}</p>`).join("")}
      <div class="fontes">${m.fontes.map(f=>f.link
        ? `<a class="fonte" href="${f.link}" target="_blank" rel="noopener">${f.nome} ↗</a>`
        : `<span class="fonte sem">${f.nome}</span>`).join("")}</div>
    </div>
    <ol class="lista">${l.map(d=>{
      const e = est(d.id), lib = liberado(d);
      const cls = !lib ? "bloq" : e.s==="Concluído" ? "feito" : e.s==="Travei" ? "trava" : "";
      return `<li class="${cls}" data-id="${d.id}">
        <div class="num"></div>
        <div>
          <div class="tt">${d.t}</div>
          ${lib ? `<div class="cc">${d.c}</div>` : `<div class="gg">Destrava quando: ${d.gat}</div>`}
          <div class="onde">${(d.fontes||[]).map(chipFonte).join("")}</div>
        </div>
        ${lib
          ? `<select data-s="${d.id}">${STATUS.map(s=>`<option ${s===e.s?"selected":""}>${s}</option>`).join("")}</select>`
          : `<select data-u="${d.id}"><option>Bloqueado</option><option>Destravar</option></select>`}
      </li>`;
    }).join("")}</ol>`;
  document.getElementById("volta").onclick = () => { aberta=null; desenhar(); };
  document.querySelectorAll("[data-s]").forEach(s=>s.onchange=()=>{
    const e = est(s.dataset.s);
    e.s = s.value;
    if(s.value==="Concluído"){ if(!e.c) e.c=hoje(); if(!e.rev){ e.rev=hoje(); e.rn=0; } }
    else { e.c=""; e.rev=""; e.rn=0; }
    salvar(); desenhar();
  });
  document.querySelectorAll("[data-u]").forEach(s=>s.onchange=()=>{
    if(s.value==="Destravar"){ est(s.dataset.u).ok=true; salvar(); desenhar(); }
  });
}

function desenhar(){ aberta ? telaDetalhe() : telaMaterias(); }

document.getElementById("bkp").onclick=()=>{
  const b=new Blob([JSON.stringify(estado,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="backup-dojo-"+hoje()+".json"; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("rst").onclick=()=>document.getElementById("arq").click();
document.getElementById("arq").onchange=ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ estado=JSON.parse(r.result); if(!estado._dias)estado._dias=[];
    salvar(); desenhar(); aviso("Backup restaurado."); }catch(e){ aviso("Arquivo inválido."); } };
  r.readAsText(f);
};

carregar();
</script>
